<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#3B2A5C" />
    <title>Shadowbridge</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="game">
      <section id="select-screen" class="screen">
        <header class="hud">
          <span id="game-title">Shadowbridge</span>
          <span id="done-count"></span>
        </header>
        <p class="message">Pick a level.</p>
        <div id="level-grid" class="level-grid"></div>
      </section>

      <section id="play-screen" class="screen" hidden>
        <header class="hud">
          <button id="back" class="btn-link" type="button">‹ Levels</button>
          <span id="level-label">Level 1</span>
          <span id="moves">Moves: 0</span>
        </header>
        <canvas id="board" aria-label="Game board"></canvas>
        <p id="message" class="message" role="status">Set the sun, press Go, and keep turning it while Pip walks.</p>
        <footer class="controls">
          <button id="restart" class="btn btn-secondary" type="button">Restart</button>
          <button id="go" class="btn btn-primary" type="button">Go</button>
        </footer>

        <div id="result" class="result" hidden>
          <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
            <h2 id="result-title">Wonderful!</h2>
            <p id="result-detail" class="result-detail">Moves: 0</p>
            <div class="result-actions">
              <button id="result-next" class="btn btn-primary" type="button">Next level</button>
              <button id="result-retry" class="btn btn-secondary" type="button">Retry</button>
              <button id="result-levels" class="btn btn-secondary" type="button">Levels</button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <button id="sound" class="sound-btn" type="button" aria-label="Turn sound off" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
        <path class="sound-on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <path class="sound-off" d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
